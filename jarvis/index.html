<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://www.google.com https://*.google.com https://speech.google.com;">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="titlebar">
    <span class="title">JARVIS</span>
    <div class="titlebar-controls">
      <button id="btnMinimize" class="tb-btn" title="Minimizar">&#8211;</button>
      <button id="btnClose" class="tb-btn close" title="Cerrar">&#10005;</button>
    </div>
  </div>

  <div class="screen">
    <div class="orbs" id="orbs">
      <div class="orb ring1"></div>
      <div class="orb ring2"></div>
      <div class="orb ring3"></div>
      <div class="orb core"></div>
    </div>

    <div class="providers">
      <button class="provider-btn" data-provider="openrouter" title="OpenRouter"><span class="dot"></span>OpenRouter</button>
      <button class="provider-btn" data-provider="openai" title="OpenAI"><span class="dot"></span>OpenAI</button>
      <button class="provider-btn" data-provider="ollama" title="Ollama (local)"><span class="dot"></span>Ollama</button>
    </div>

    <div class="config" id="config">
      <div class="conn-status" id="connStatus"></div>

      <div class="config-row api-key-row">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
      </div>
      <div class="help-text api-key-help hidden" id="apiKeyHelp"></div>

      <div class="config-row model-row">
        <label for="model">Modelo</label>
        <input type="text" id="model" placeholder="auto">
      </div>

      <div class="config-row ollama-only hidden">
        <label for="ollamaBase">Ollama URL</label>
        <input type="text" id="ollamaBase" placeholder="http://localhost:11434">
      </div>
      <div class="config-row ollama-only hidden">
        <label for="ollamaModel">Modelo Ollama</label>
        <select id="ollamaModel"></select>
      </div>

      <div class="config-row">
        <label for="voice">Voz</label>
        <select id="voice"></select>
      </div>

      <div class="config-row omni-row">
        <label for="omniToggle">Omnipresencia</label>
        <label class="switch">
          <input type="checkbox" id="omniToggle">
          <span class="slider"></span>
        </label>
        <span class="omni-hint" id="omniHint">Escucha siempre "Oye Jarvis". Contexto+Clic der.</span>
      </div>

      <div class="config-actions">
        <button id="btnTest" class="test-btn">Verificar conexión</button>
        <span id="testResult" class="test-result"></span>
      </div>
    </div>

    <div class="status" id="status">En espera...</div>

    <div class="log" id="log"></div>
  </div>

  <div class="mic-area">
    <button id="btnMic" class="mic-btn" title="Mantener para hablar / alternar escucha">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M17 11a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <div class="mic-hint">Mantén presionado para hablar (o activa la escucha continua)</div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
